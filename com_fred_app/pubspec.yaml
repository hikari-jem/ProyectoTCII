name: com_fred_app
description: Aplicacion nativa COM-FRED con alertas remotas y Bluetooth BLE.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  mqtt_client: ^10.2.0
  flutter_blue_plus: ^1.32.12
  flutter_tts: ^4.0.2
  flutter_local_notifications: ^17.1.2
  record: ^5.1.0
  audioplayers: ^6.0.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  permission_handler: ^11.3.1

dependency_overrides:
  record_linux: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true